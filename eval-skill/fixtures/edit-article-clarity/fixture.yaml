name: edit-article-clarity
description: >
  Give the agent a messy, rambling markdown draft and check that the
  edit-article skill produces a restructured, tightened version.
task: task.md
assert:
  - type: file_exists
    path: output/edited.md
  - type: file_not_contains
    path: output/edited.md
    patterns:
      - "(?i)in conclusion"
      - "(?i)as mentioned earlier"
  - type: file_min_lines
    path: output/edited.md
    count: 10
judge:
  rubric: rubric.md
  max_score: 5
runs: 3
